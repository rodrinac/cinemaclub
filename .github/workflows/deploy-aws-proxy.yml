name: Deploy production

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
    branches: [main]

concurrency:
  group: production-release
  cancel-in-progress: false

permissions: {}

jobs:
  verify-release:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should_deploy: ${{ steps.gate.outputs.should_deploy }}
    steps:
      - name: Evaluate release gate
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            echo "### 🚀 Manual Dispatch" >> "$GITHUB_STEP_SUMMARY"
            echo "Workflow triggered manually via \`workflow_dispatch\`. Proceeding with deployment." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          head_sha="${{ github.event.workflow_run.head_sha }}"
          version="$(gh api "repos/${{ github.repository }}/contents/package.json?ref=${head_sha}" --jq '.content' | base64 -d | jq -r '.version')"
          tag="v${version}"

          echo "Checking release status for tag ${tag} at commit ${head_sha}..."

          release_info=""
          if ! release_info="$(gh release view "$tag" --repo "${{ github.repository }}" --json tagName,targetCommitish 2>&1)"; then
            echo "::warning::Failed to retrieve GitHub release for tag ${tag}: ${release_info}"
            release_info=""
          fi

          if [ -z "$release_info" ]; then
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            echo "### ⏭️ Deployment Skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "No GitHub release found for tag \`${tag}\`. Skipping deployment." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          target_commit="$(echo "$release_info" | jq -r '.targetCommitish // empty')"

          if [ "$target_commit" = "$head_sha" ] || [ "$target_commit" = "main" ] || [ -z "$target_commit" ]; then
            # Verify tag object or reference points to head_sha if needed
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            echo "### ✅ Release Verified" >> "$GITHUB_STEP_SUMMARY"
            echo "Verified GitHub release for \`${tag}\` matching commit \`${head_sha}\`. Proceeding with deployment." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            echo "### ⏭️ Deployment Skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "Release \`${tag}\` target (\`${target_commit}\`) does not match triggering commit \`${head_sha}\`. Skipping deployment." >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    needs: verify-release
    if: ${{ needs.verify-release.outputs.should_deploy == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment: production
    env:
      TF_VAR_service_name: ${{ vars.TMDB_PROXY_SERVICE_NAME }}
      TF_VAR_api_stage_name: ${{ vars.TMDB_PROXY_STAGE_NAME }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_tmdb_secret_arn: ${{ secrets.TMDB_SECRET_ARN }}
      TF_VAR_log_retention_days: ${{ vars.TMDB_PROXY_LOG_RETENTION_DAYS }}
      TF_VAR_cors_allow_origin: ${{ vars.TMDB_PROXY_CORS_ALLOW_ORIGIN }}
      TF_VAR_rate_limit_rps: ${{ vars.TMDB_PROXY_RATE_LIMIT_RPS }}
      TF_VAR_rate_limit_burst: ${{ vars.TMDB_PROXY_RATE_LIMIT_BURST }}
      TF_VAR_alarm_notification_arn: ${{ vars.TMDB_PROXY_ALARM_NOTIFICATION_ARN }}
      TF_VAR_lambda_error_alarm_threshold: ${{ vars.TMDB_PROXY_LAMBDA_ERROR_ALARM_THRESHOLD }}
      TF_VAR_lambda_throttle_alarm_threshold: ${{ vars.TMDB_PROXY_LAMBDA_THROTTLE_ALARM_THRESHOLD }}
      TF_VAR_lambda_duration_alarm_threshold_ms: ${{ vars.TMDB_PROXY_LAMBDA_DURATION_ALARM_THRESHOLD_MS }}
      TF_VAR_api_5xx_alarm_threshold: ${{ vars.TMDB_PROXY_API_5XX_ALARM_THRESHOLD }}
      AWS_REGION: ${{ vars.AWS_REGION }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Install dependencies
        run: npm ci

      - name: Validate deployment inputs
        run: |
          set -eu
          trim_var() {
            eval "value=\${$1:-}"
            printf '%s' "$value" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//'
          }

          required_vars="TF_VAR_service_name TF_VAR_api_stage_name TF_VAR_aws_region TF_VAR_tmdb_secret_arn TF_VAR_log_retention_days"
          for var_name in $required_vars; do
            value="$(trim_var "$var_name")"
            if [ -z "$value" ]; then
              echo "$var_name is required for deployment" >&2
              exit 1
            fi
          done

          raw_cors_allow_origin="${TF_VAR_cors_allow_origin:-}"
          if [ -n "$raw_cors_allow_origin" ] && [ -z "$(trim_var TF_VAR_cors_allow_origin)" ]; then
            echo "TF_VAR_cors_allow_origin cannot be blank when provided" >&2
            exit 1
          fi

          rate_limit_rps="$(trim_var TF_VAR_rate_limit_rps)"
          rate_limit_burst="$(trim_var TF_VAR_rate_limit_burst)"
          if [ -z "$rate_limit_rps" ] && [ -z "$rate_limit_burst" ]; then
            echo "Hosted rate limiting disabled for this deployment."
          elif [ -n "$rate_limit_rps" ] && [ -n "$rate_limit_burst" ]; then
            echo "Hosted rate limiting enabled for this deployment."
          else
            echo "TF_VAR_rate_limit_rps and TF_VAR_rate_limit_burst must both be set to enable rate limiting" >&2
            exit 1
          fi

      - name: Terraform init
        run: |
          terraform -chdir=infra init \
            -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ vars.TF_STATE_KEY }}" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ vars.TF_STATE_LOCK_TABLE }}" \
            -backend-config="encrypt=true"

      - name: Mask sensitive Terraform outputs from existing state
        run: |
          set -eu
          # Terraform plan/apply print resource IDs (which embed rest_api_id,
          # log group names, etc.) during state refresh, before the Lambda/API
          # Gateway resources are (re)created. Mask any values already present
          # in remote state now so they never appear in plaintext in the plan
          # or apply step logs below. A fresh stack with no state yet will
          # simply produce no output here, which is fine.
          terraform -chdir=infra output -json > infra/terraform-output.json 2>/dev/null || echo '{}' > infra/terraform-output.json
          for output_name in \
            rest_api_id \
            stage_invoke_url \
            movies_api_base_url \
            lambda_log_group_name \
            api_access_log_group_name \
            api_execution_log_group_name
          do
            value="$(jq -r --arg name "$output_name" '.[$name].value // empty' infra/terraform-output.json)"
            if [ -n "$value" ]; then
              echo "::add-mask::$value"
            fi
          done

      - name: Terraform plan
        run: |
          normalize_optional_tf_var() {
            eval "value=\${$1:-}"
            if [ -z "$(printf '%s' "$value" | tr -d '[:space:]')" ]; then
              unset "$1"
            fi
          }

          for var_name in \
            TF_VAR_cors_allow_origin \
            TF_VAR_rate_limit_rps \
            TF_VAR_rate_limit_burst \
            TF_VAR_alarm_notification_arn \
            TF_VAR_lambda_error_alarm_threshold \
            TF_VAR_lambda_throttle_alarm_threshold \
            TF_VAR_lambda_duration_alarm_threshold_ms \
            TF_VAR_api_5xx_alarm_threshold
          do
            normalize_optional_tf_var "$var_name"
          done

          terraform -chdir=infra plan -input=false -out=deploy.tfplan

      - name: Terraform apply
        run: terraform -chdir=infra apply -input=false -auto-approve -no-color deploy.tfplan > infra/terraform-apply.log 2>&1 || (cat infra/terraform-apply.log && exit 1)

      - name: Export Terraform outputs
        run: terraform -chdir=infra output -json > infra/terraform-output.json

      - name: Mask sensitive Terraform outputs
        run: |
          set -eu
          for output_name in \
            rest_api_id \
            stage_invoke_url \
            movies_api_base_url \
            lambda_log_group_name \
            api_access_log_group_name \
            api_execution_log_group_name
          do
            value="$(jq -r --arg name "$output_name" '.[$name].value // empty' infra/terraform-output.json)"
            if [ -n "$value" ]; then
              echo "::add-mask::$value"
            fi
          done

      - name: Run deployed smoke tests
        run: |
          export SMOKE_STAGE_URL="$(jq -r '.stage_invoke_url.value' infra/terraform-output.json)"
          export SMOKE_CORS_ALLOW_ORIGIN="$(printf '%s' "${TF_VAR_cors_allow_origin:-}" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          node scripts/smoke-aws-proxy.mjs

      - name: Store movies API base URL in Secrets Manager
        run: |
          set -eu
          SECRET_ID="cinemaclub/tmdb-proxy/prod/movies-api-base-url"
          MOVIES_API_BASE_URL="$(jq -r '.movies_api_base_url.value' infra/terraform-output.json)"
          if aws secretsmanager describe-secret --secret-id "$SECRET_ID" >/dev/null 2>&1; then
            aws secretsmanager put-secret-value \
              --secret-id "$SECRET_ID" \
              --secret-string "$MOVIES_API_BASE_URL" >/dev/null
          else
            aws secretsmanager create-secret \
              --name "$SECRET_ID" \
              --secret-string "$MOVIES_API_BASE_URL" \
              --tags Key=project,Value=cinemaclub Key=service,Value=tmdb-proxy >/dev/null
          fi

  deploy-web:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment: production
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      TMDB_PROXY_SERVICE_NAME: ${{ vars.TMDB_PROXY_SERVICE_NAME }}
      TMDB_PROXY_STAGE_NAME: ${{ vars.TMDB_PROXY_STAGE_NAME }}
      TMDB_PROXY_CORS_ALLOW_ORIGIN: ${{ vars.TMDB_PROXY_CORS_ALLOW_ORIGIN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: 23.2.0
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Resolve deployed Movies API URL
        id: resolve-movies-api-url
        run: |
          set -euo pipefail

          required_vars="AWS_REGION TMDB_PROXY_SERVICE_NAME TMDB_PROXY_STAGE_NAME TMDB_PROXY_CORS_ALLOW_ORIGIN"
          for var_name in $required_vars; do
            value="$(printenv "$var_name" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
            if [ -z "$value" ]; then
              echo "$var_name is required for web deployment" >&2
              exit 1
            fi
          done

          api_name="${TMDB_PROXY_SERVICE_NAME}-${TMDB_PROXY_STAGE_NAME}-rest-api"
          mapfile -t api_ids < <(
            aws apigateway get-rest-apis --region "$AWS_REGION" --output json |
              jq -r --arg name "$api_name" '[.items[] | select(.name == $name) | .id] | .[]'
          )

          if [ "${#api_ids[@]}" -ne 1 ] || [ -z "${api_ids[0]:-}" ]; then
            echo "Expected exactly one API Gateway REST API named $api_name, found ${#api_ids[@]}" >&2
            exit 1
          fi

          movies_api_url="https://${api_ids[0]}.execute-api.${AWS_REGION}.amazonaws.com/${TMDB_PROXY_STAGE_NAME}/api"

          case "$movies_api_url" in
            https://*) ;;
            *)
              echo "Resolved Movies API URL must use HTTPS: $movies_api_url" >&2
              exit 1
              ;;
          esac

          case "$movies_api_url" in
            */api) ;;
            *)
              echo "Resolved Movies API URL must end with /api: $movies_api_url" >&2
              exit 1
              ;;
          esac

          printf 'movies_api_url=%s\n' "$movies_api_url" >> "$GITHUB_OUTPUT"
          printf 'stage_url=%s\n' "${movies_api_url%/api}" >> "$GITHUB_OUTPUT"

      - name: Verify live Movies API health and CORS
        run: |
          set -euo pipefail

          health_response="$(
            curl --fail-with-body --retry 6 --retry-all-errors --silent --show-error \
              "${{ steps.resolve-movies-api-url.outputs.stage_url }}/health"
          )"
          printf '%s' "$health_response" | jq -e '.status == "ok"' >/dev/null

          cors_headers="$(
            curl --fail-with-body --silent --show-error \
              --dump-header - \
              --output /dev/null \
              -H "Origin: ${TMDB_PROXY_CORS_ALLOW_ORIGIN}" \
              "${{ steps.resolve-movies-api-url.outputs.movies_api_url }}/movies/now-playing"
          )"
          normalized_headers="$(printf '%s\n' "$cors_headers" | tr -d '\r')"

          printf '%s\n' "$normalized_headers" |
            grep -Fxi "Access-Control-Allow-Origin: ${TMDB_PROXY_CORS_ALLOW_ORIGIN}" >/dev/null
          printf '%s\n' "$normalized_headers" | grep -Fxi "Vary: Origin" >/dev/null

      - name: Sync EAS production Movies API URL
        run: |
          eas env:set production \
            --name EXPO_PUBLIC_MOVIES_API_URL \
            --value "${{ steps.resolve-movies-api-url.outputs.movies_api_url }}" \
            --visibility plaintext \
            --scope project \
            --non-interactive

      - name: Build Expo web export
        run: npm run build:web:production

      - name: Deploy Expo web export
        id: deploy-expo-web
        run: |
          set -euo pipefail

          deploy_json="$(
            eas deploy \
              --export-dir dist \
              --environment production \
              --prod \
              --non-interactive \
              --json
          )"
          printf '%s\n' "$deploy_json"

          deployment_url="$(
            DEPLOY_JSON="$deploy_json" node -e 'const data = JSON.parse(process.env.DEPLOY_JSON); const urls = []; const walk = (value) => { if (typeof value === "string") { if (/^https:\/\/[^\s]+\.expo\.app\/?$/.test(value)) { urls.push(value); } return; } if (Array.isArray(value)) { value.forEach(walk); return; } if (value && typeof value === "object") { Object.values(value).forEach(walk); } }; walk(data); const normalized = urls.map((value) => { try { const url = new URL(value); return `${url.origin}${url.pathname}`; } catch { return null; } }).filter(Boolean); const preferred = normalized.find((value) => !new URL(value).hostname.includes("--")) ?? normalized[0]; if (!preferred) { console.error("Unable to resolve Expo deployment URL from eas deploy output."); process.exit(1); } process.stdout.write(preferred);'
          )"

          printf 'deployment_url=%s\n' "$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Verify deployed Expo web URL
        run: |
          curl --fail --retry 6 --retry-all-errors --silent --show-error --location \
            "${{ steps.deploy-expo-web.outputs.deployment_url }}" >/dev/null
