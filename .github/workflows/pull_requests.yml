name: Lint & Format

on: [pull_request]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Prettier Check
        run: npx prettier --check .

      - name: Type Check
        run: npx tsc --noEmit

      - name: Check API Server Syntax
        run: node --check server/movies-api.mjs

      - name: API Health Smoke Test
        run: |
          TMDB_API_TOKEN=dummy_token_for_ci node server/movies-api.mjs &
          API_PID=$!
          sleep 2
          curl --fail http://127.0.0.1:3001/health
          kill $API_PID
