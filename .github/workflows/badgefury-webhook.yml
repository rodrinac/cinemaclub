name: Badge Fury Webhook

on:
  release:
    types: [published]
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  notify-badgefury:
    runs-on: ubuntu-latest
    steps:
      - name: Check Badge Fury webhook availability
        id: webhook-check
        env:
          BADGE_FURY_WEBHOOK_URL: ${{ secrets.BADGE_FURY_WEBHOOK_URL }}
        run: |
          if [ -n "$BADGE_FURY_WEBHOOK_URL" ]; then
            echo "has_webhook=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_webhook=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Badge Fury webhook
        if: ${{ steps.webhook-check.outputs.has_webhook == 'true' }}
        env:
          BADGE_FURY_WEBHOOK_URL: ${{ secrets.BADGE_FURY_WEBHOOK_URL }}
        run: |
          curl --fail --silent --show-error --location --request POST "$BADGE_FURY_WEBHOOK_URL"
