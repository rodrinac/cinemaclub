name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  action-pins:
    runs-on: ubuntu-latest
    # Same skip rule as the rest of CI: version-bump-only commits/PRs add no value here.
    if: >-
      ${{
        (github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip version-bump]')) &&
        (github.event_name != 'pull_request' || github.head_ref != 'chore/version-bump')
      }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require SHA-pinned GitHub Actions
        run: |
          set -euo pipefail
          bad="$(
            grep -REn '^\s*uses:\s*' .github/workflows --include='*.yml' --include='*.yaml' \
              | grep -Ev '^\s*#' \
              | grep -Ev 'uses:\s*\./' \
              | grep -Ev 'uses:\s*docker://' \
              | grep -Ev 'uses:\s*[^@[:space:]]+@[0-9a-f]{40}(\s|$|#)' \
              || true
          )"
          if [ -n "$bad" ]; then
            echo "Unpinned GitHub Actions uses: entries (must be a full 40-char commit SHA):"
            echo "$bad"
            exit 1
          fi
          echo "All remote workflow uses: entries are pinned to 40-char commit SHAs."

  ci:
    runs-on: ubuntu-latest
    # Skip pure version-bump commits/PRs: they only touch package.json/app.json
    # version fields and add no value re-running the full lint/build/test suite.
    if: >-
      ${{
        (github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip version-bump]')) &&
        (github.event_name != 'pull_request' || github.head_ref != 'chore/version-bump')
      }}

    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --user 1001

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Linting
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Validate Node proxy sources
        run: |
          node --check server/movies-api.mjs
          node --check server/tmdb-proxy-core.mjs
          node --check server/tmdb-lambda.mjs
          node --check scripts/smoke-aws-proxy.mjs

      - name: Prebuild Check
        run: npm run prebuild:check

      - name: Web Build Check
        run: npm run build:web

      - name: Run Test Suite & Smoke Tests
        env:
          TMDB_API_TOKEN: "dummy_token_for_ci"
        run: |
          node --test tests/tmdb-lambda.test.mjs
          npm run test:ci

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-stub-artifacts
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  infrastructure:
    runs-on: ubuntu-latest
    if: >-
      ${{
        (github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip version-bump]')) &&
        (github.event_name != 'pull_request' || github.head_ref != 'chore/version-bump')
      }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.11.4

      - name: Terraform format check
        run: terraform -chdir=infra fmt -check

      - name: Terraform validate
        run: |
          terraform -chdir=infra init -backend=false
          terraform -chdir=infra validate

      - name: Terraform plan packaging check
        env:
          AWS_ACCESS_KEY_ID: dummy
          AWS_SECRET_ACCESS_KEY: dummy
          AWS_DEFAULT_REGION: eu-west-1
        run: |
          # The real backend is S3 (partial config, filled in via -backend-config
          # in the deploy workflow). This packaging-only check never touches real
          # state, so it swaps in a throwaway local backend to avoid needing
          # real backend credentials/config here.
          cat > infra/override.tf <<'EOF'
          terraform {
            backend "local" {}
          }
          EOF
          trap 'rm -f infra/override.tf infra/terraform.tfstate' EXIT

          terraform -chdir=infra init -reconfigure -input=false
          terraform -chdir=infra plan -input=false -lock=false -refresh=false \
            -var='service_name=cinemaclub-tmdb-proxy' \
            -var='api_stage_name=prod' \
            -var='aws_region=eu-west-1' \
            -var='tmdb_secret_arn=arn:aws:secretsmanager:REGION:ACCOUNT:secret:example' \
            -var='log_retention_days=14' \
            -var='rate_limit_rps=5' \
            -var='rate_limit_burst=5' \
            -var='skip_aws_provider_validation=true'

  live-e2e-gate:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    needs: [ci, infrastructure]
    outputs:
      has_tmdb_token: ${{ steps.token-check.outputs.has_tmdb_token }}

    steps:
      - name: Check TMDB token availability
        id: token-check
        env:
          TMDB_API_TOKEN: ${{ secrets.TMDB_API_TOKEN }}
        run: |
          if [ -n "$TMDB_API_TOKEN" ]; then
            echo "has_tmdb_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_tmdb_token=false" >> "$GITHUB_OUTPUT"
          fi

  e2e-live:
    if: ${{ github.event_name == 'pull_request' && needs.live-e2e-gate.outputs.has_tmdb_token == 'true' }}
    runs-on: ubuntu-latest
    needs: live-e2e-gate

    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --user 1001

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Web Build Check
        run: npm run build:web

      - name: Run live Playwright suite
        env:
          TMDB_API_TOKEN: ${{ secrets.TMDB_API_TOKEN }}
        run: npm run test:e2e:live:ci

      - name: Upload live Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-live-artifacts
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
