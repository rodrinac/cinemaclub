name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Linting
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Prebuild Check
        run: npm run prebuild:check

      - name: Web Build Check
        run: npm run build:web

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Test Suite & Smoke Tests
        env:
          TMDB_API_TOKEN: ${{ secrets.TMDB_API_TOKEN || 'dummy_token_for_ci' }}
        run: npm run test:ci
