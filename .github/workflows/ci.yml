name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Linting
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Prebuild Check
        run: npm run prebuild:check

      - name: Web Build Check
        run: npm run build:web

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Test Suite & Smoke Tests
        env:
          TMDB_API_TOKEN: ${{ secrets.TMDB_API_TOKEN || 'dummy_token_for_ci' }}
        run: npm run test:ci

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-stub-artifacts
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  e2e-live:
    if: ${{ secrets.TMDB_API_TOKEN != '' }}
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Web Build Check
        run: npm run build:web

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run live Playwright suite
        env:
          TMDB_API_TOKEN: ${{ secrets.TMDB_API_TOKEN }}
        run: npm run test:e2e:live:ci

      - name: Upload live Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-live-artifacts
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
