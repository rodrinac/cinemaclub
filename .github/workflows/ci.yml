name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    # Skip pure version-bump commits/PRs: they only touch package.json/app.json
    # version fields and add no value re-running the full lint/build/test suite.
    if: >-
      ${{
        (github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip version-bump]')) &&
        (github.event_name != 'pull_request' || github.head_ref != 'chore/version-bump')
      }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.4

      - name: Install dependencies
        run: npm ci

      - name: Linting
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Validate Node proxy sources
        run: |
          node --check server/movies-api.mjs
          node --check server/tmdb-proxy-core.mjs
          node --check server/tmdb-lambda.mjs
          node --check scripts/smoke-aws-proxy.mjs

      - name: Terraform format check
        run: terraform -chdir=infra fmt -check

      - name: Terraform validate
        run: |
          terraform -chdir=infra init -backend=false
          terraform -chdir=infra validate

      - name: Terraform plan packaging check
        env:
          AWS_ACCESS_KEY_ID: dummy
          AWS_SECRET_ACCESS_KEY: dummy
          AWS_DEFAULT_REGION: eu-west-1
        run: |
          # The real backend is S3 (partial config, filled in via -backend-config
          # in the deploy workflow). This packaging-only check never touches real
          # state, so it swaps in a throwaway local backend to avoid needing
          # real backend credentials/config here.
          cat > infra/override.tf <<'EOF'
          terraform {
            backend "local" {}
          }
          EOF
          trap 'rm -f infra/override.tf infra/terraform.tfstate' EXIT

          terraform -chdir=infra init -reconfigure -input=false
          terraform -chdir=infra plan -input=false -lock=false -refresh=false \
            -var='service_name=cinemaclub-tmdb-proxy' \
            -var='api_stage_name=prod' \
            -var='aws_region=eu-west-1' \
            -var='tmdb_secret_arn=arn:aws:secretsmanager:REGION:ACCOUNT:secret:example' \
            -var='log_retention_days=14' \
            -var='rate_limit_rps=5' \
            -var='rate_limit_burst=5' \
            -var='skip_aws_provider_validation=true'

      - name: Prebuild Check
        run: npm run prebuild:check

      - name: Web Build Check
        run: npm run build:web

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Test Suite & Smoke Tests
        env:
          TMDB_API_TOKEN: "dummy_token_for_ci"
        run: |
          node --test tests/tmdb-lambda.test.mjs
          npm run test:ci

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-stub-artifacts
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  live-e2e-gate:
    runs-on: ubuntu-latest
    needs: ci
    outputs:
      has_tmdb_token: ${{ steps.token-check.outputs.has_tmdb_token }}

    steps:
      - name: Check TMDB token availability
        id: token-check
        env:
          TMDB_API_TOKEN: ${{ secrets.TMDB_API_TOKEN }}
        run: |
          if [ -n "$TMDB_API_TOKEN" ]; then
            echo "has_tmdb_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_tmdb_token=false" >> "$GITHUB_OUTPUT"
          fi

  e2e-live:
    if: ${{ needs.live-e2e-gate.outputs.has_tmdb_token == 'true' }}
    runs-on: ubuntu-latest
    needs: live-e2e-gate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Web Build Check
        run: npm run build:web

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run live Playwright suite
        env:
          TMDB_API_TOKEN: ${{ secrets.TMDB_API_TOKEN }}
        run: npm run test:e2e:live:ci

      - name: Upload live Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-live-artifacts
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
