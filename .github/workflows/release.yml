name: Release

on:
  workflow_run:
    workflows: ["Deploy production"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'

    steps:
      # Intentionally does not check out the deployed commit: "Deploy production" only
      # triggers on push to main/master (never on pull_request/pull_request_target), so
      # the commit is already trusted, but this workflow still avoids checking out and
      # executing any repository code in this privileged (workflow_run) context. The
      # version is read directly via the Contents API instead.
      - name: Read version from package.json at the deployed commit
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(
            gh api "repos/${{ github.repository }}/contents/package.json?ref=${{ github.event.workflow_run.head_sha }}" \
              --jq '.content' | base64 -d | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version"
          )"
          tag="v${version}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Check whether the release tag already exists
        id: existing-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release tag via the GitHub API
        if: steps.existing-tag.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api "repos/${{ github.repository }}/git/refs" \
            --method POST \
            -f "ref=refs/tags/${{ steps.version.outputs.tag }}" \
            -f "sha=${{ github.event.workflow_run.head_sha }}"

      - name: Create GitHub release
        if: steps.existing-tag.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --generate-notes \
            --target "${{ github.event.workflow_run.head_sha }}"
