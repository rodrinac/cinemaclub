name: Release

on:
  push:
    branches: [master, main]
    paths:
      - "package.json"
      - "app.json"

permissions:
  contents: write

concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: true

jobs:
  release:
    if: ${{ contains(github.event.head_commit.message, '[skip version-bump]') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Read version from package.json
        id: version
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Check whether the release tag already exists
        id: existing-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1 || gh api "repos/${{ github.repository }}/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release tag via the GitHub API
        if: steps.existing-tag.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api "repos/${{ github.repository }}/git/refs" \
            --method POST \
            -f "ref=refs/tags/${{ steps.version.outputs.tag }}" \
            -f "sha=${{ github.sha }}"

      - name: Create GitHub release
        if: steps.existing-tag.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --generate-notes \
            --target "${{ github.sha }}"
