[package]
name = "cinemaclub-worker"
version = "3.0.0"
edition = "2021"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5"

[target.'cfg(target_arch = "wasm32")'.dependencies]
worker = "0.9.0"

[profile.release]
lto = true
codegen-units = 1
